async function applyManage(){
  let ns=state.schedule.map(s=>({...s,students:[...(s.students||[])]}));
  Object.entries(manState.pending).forEach(([sk,ch])=>{
    const si=ns.findIndex(s=>slotKey(s)===sk);if(si===-1)return;
    if(ch.newTeacher&&ch.newTeacher!==ns[si].teacher)ns[si]={...ns[si],teacher:ch.newTeacher};
    if(ch.moves)Object.entries(ch.moves).forEach(([n,tgt])=>{
      if(!tgt)return;
      ns[si].students=ns[si].students.filter(x=>x!==n);
      const ti=ns.findIndex(s=>slotKey(s)===tgt);
      if(ti!==-1&&!ns[ti].students.includes(n))ns[ti]={...ns[ti],students:[...ns[ti].students,n]};
    });
  });
  await saveSchedule(ns);manState.pending={};manState.savedMsg='Changes saved ✓';
  setTimeout(()=>{manState.savedMsg='';renderManage();},3000);
  renderManage();renderRegister();
}

// ── Hours tab (clock in/out) ───────────────────────────────────────────────
// Storage: 'ewj-hours' → array of {id, teacher, date, clockIn, clockOut, hoursWorked, note, status}
// status: 'in' | 'out'

function getHours(){return Array.isArray(state.hours)?state.hours:(lsGet('ewj-hours',[]))}
async function saveHours(hrs){state.hours=hrs;lsSet('ewj-hours',hrs);await fbSet('ewj-hours',hrs);}

function fmtHHMM(d){return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function fmtDateEN(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function calcDuration(inISO,outISO){
  const diff=(new Date(outISO)-new Date(inISO))/1000/60;
  if(diff<0)return'--';
  const h=Math.floor(diff/60),m=Math.round(diff%60);
  return h+'h '+(m<10?'0':'')+m+'m';
}
function calcDecimal(inISO,outISO){
  const diff=(new Date(outISO)-new Date(inISO))/1000/3600;
  return diff<0?0:Math.round(diff*100)/100;
}

const hoursState={filterTeacher:'',filterMonth:'',view:'my'}; // view: 'my'|'all'

function renderHours(){
  const wrap=document.getElementById('tab-hours');wrap.innerHTML='';
  const at=state.activeTeacher;
  // Change PIN button (admin only)
  if(!at){
    const pinRow=document.createElement('div');pinRow.style.cssText='text-align:right;margin-bottom:10px;';
    const pinBtn=document.createElement('button');pinBtn.style.cssText='border:1.5px solid #e2e8f0;background:#fff;border-radius:7px;padding:5px 11px;font-size:11px;font-family:inherit;cursor:pointer;color:#94a3b8;';
    pinBtn.textContent='🔐 Change admin PIN';
    pinBtn.onclick=()=>{
      const cur=getAdminPin();
      const old_=prompt('Enter current PIN:');
      if(old_!==cur){alert('Incorrect PIN.');return;}
      const newP=prompt('New PIN (4+ digits):');
      if(!newP||newP.trim().length<4){alert('PIN must be at least 4 digits.');return;}
      const conf=prompt('Confirm new PIN:');
      if(newP.trim()!==conf){alert('PINs do not match.');return;}
      setAdminPin(newP.trim());alert('PIN updated.');
    };
    pinRow.appendChild(pinBtn);wrap.appendChild(pinRow);
  }

  const allH=getHours();
  const now=new Date();

  // Check if current teacher is clocked in
  const activeSessions=allH.filter(h=>h.status==='in'&&(!at||h.teacher===at));
  const myActive=at?allH.find(h=>h.status==='in'&&h.teacher===at):null;

  // ── Clock in/out panel ──────────────────────────────────────────────────
  if(at){
    const panel=document.createElement('div');
    if(myActive){
      // Clocked in — show elapsed time and clock out button
      const elapsed=Math.round((now-new Date(myActive.clockIn))/1000/60);
      const eh=Math.floor(elapsed/60),em=elapsed%60;
      panel.style.cssText='background:#f0fdf4;border:1.5px solid #86efac;border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;';
      panel.innerHTML='<div style="font-size:12px;color:#15803d;font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Clocked in</div>'
        +'<div style="font-size:28px;font-weight:700;color:#15803d;margin-bottom:4px;" id="elapsed-display">'+eh+'h '+String(em).padStart(2,'0')+'m</div>'
        +'<div style="font-size:13px;color:#64748b;margin-bottom:14px;">Since '+fmtHHMM(new Date(myActive.clockIn))+' · '+fmtDateEN(new Date(myActive.clockIn))+'</div>';
      // Note input
      const noteWrap=document.createElement('div');noteWrap.style.marginBottom='12px';
      const noteIn=document.createElement('input');noteIn.type='text';noteIn.placeholder='Add a note (optional)…';noteIn.value=myActive.note||'';noteIn.style.cssText='width:100%;padding:8px 11px;border:1.5px solid #86efac;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;outline:none;';
      noteIn.oninput=e=>{const h=getHours();const idx=h.findIndex(x=>x.id===myActive.id);if(idx>=0){h[idx].note=e.target.value;saveHours(h);}};
      noteWrap.appendChild(noteIn);panel.appendChild(noteWrap);
      // Clock out button
      const outBtn=document.createElement('button');outBtn.style.cssText='background:#dc2626;color:#fff;border:none;border-radius:10px;padding:13px 32px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;';
      outBtn.textContent='Clock Out';outBtn.onclick=()=>{
        const h=getHours();const idx=h.findIndex(x=>x.id===myActive.id);
        if(idx>=0){const outTime=new Date();h[idx].clockOut=outTime.toISOString();h[idx].clockOutDisplay=fmtHHMM(outTime);h[idx].status='out';h[idx].hoursWorked=calcDecimal(h[idx].clockIn,h[idx].clockOut);h[idx].duration=calcDuration(h[idx].clockIn,h[idx].clockOut);saveHours(h);}
        renderHours();
      };
      panel.appendChild(outBtn);
      // Live clock update
      const ticker=setInterval(()=>{
        const disp=document.getElementById('elapsed-display');
        if(!disp){clearInterval(ticker);return;}
        const el2=Math.round((new Date()-new Date(myActive.clockIn))/1000/60);
        disp.textContent=Math.floor(el2/60)+'h '+String(el2%60).padStart(2,'0')+'m';
      },30000);
    } else {
      // Not clocked in
      panel.style.cssText='background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:20px;text-align:center;margin-bottom:16px;';
      panel.innerHTML='<div style="font-size:28px;margin-bottom:8px;">⏱</div>'
        +'<div style="font-size:15px;font-weight:600;color:#1e293b;margin-bottom:4px;">'+at+'</div>'
        +'<div style="font-size:13px;color:#64748b;margin-bottom:14px;">'+fmtDateEN(now)+' · '+fmtHHMM(now)+'</div>';
      const inBtn=document.createElement('button');inBtn.style.cssText='background:#4f46e5;color:#fff;border:none;border-radius:10px;padding:13px 32px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;';
      inBtn.textContent='Clock In';inBtn.onclick=()=>{
        const h=getHours();const n=new Date();
        h.push({id:Date.now(),teacher:at,date:fmtDateEN(n),dateISO:n.toISOString().slice(0,10),clockIn:n.toISOString(),clockInDisplay:fmtHHMM(n),clockOut:null,clockOutDisplay:null,status:'in',hoursWorked:null,duration:null,note:''});
        saveHours(h);renderHours();
      };
      panel.appendChild(inBtn);
    }
    wrap.appendChild(panel);
  }

  // ── Admin: show active sessions from all teachers ───────────────────────
  if(!at&&activeSessions.length>0){
    const activePanel=document.createElement('div');activePanel.style.cssText='background:#fef9c3;border:1.5px solid #fde047;border-radius:12px;padding:12px 14px;margin-bottom:14px;';
    activePanel.innerHTML='<div style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#854d0e;margin-bottom:8px;">Currently clocked in</div>';
    activeSessions.forEach(s=>{
      const elapsed=Math.round((now-new Date(s.clockIn))/1000/60);
      const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-bottom:1px solid #fde04755;';
      row.innerHTML='<strong>'+s.teacher+'</strong><span style="color:#854d0e;">since '+s.clockInDisplay+' ('+Math.floor(elapsed/60)+'h '+String(elapsed%60).padStart(2,'0')+'m)</span>';
      activePanel.appendChild(row);
    });
    wrap.appendChild(activePanel);
  }

  // ── History / Admin view ────────────────────────────────────────────────
  const viewToggle=document.createElement('div');viewToggle.style.cssText='display:flex;gap:6px;margin-bottom:12px;';
  if(at){
    ['My Hours','All Teachers'].forEach((label,i)=>{
      const v=i===0?'my':'all';
      const b=document.createElement('button');b.className='pill'+(hoursState.view===v?' on':'');b.textContent=label;
      b.onclick=()=>{hoursState.view=v;renderHours();};viewToggle.appendChild(b);
    });
  }
  wrap.appendChild(viewToggle);

  // Filters
  const filterRow=document.createElement('div');filterRow.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;';

  if(!at||hoursState.view==='all'){
    const tDiv=document.createElement('div');tDiv.innerHTML='<div class="lbl">Teacher</div>';
    const tSel=document.createElement('select');
    tSel.innerHTML='<option value="">All teachers</option>'+TEACHERS.map(t=>'<option'+(t===hoursState.filterTeacher?' selected':'')+'>'+t+'</option>').join('');
    tSel.onchange=e=>{hoursState.filterTeacher=e.target.value;renderHours();};tDiv.appendChild(tSel);filterRow.appendChild(tDiv);
  }

  const mDiv=document.createElement('div');mDiv.innerHTML='<div class="lbl">Month</div>';
  const months=[...new Set(allH.map(h=>h.dateISO?h.dateISO.slice(0,7):'').filter(Boolean))].sort().reverse();
  const mSel=document.createElement('select');mSel.innerHTML='<option value="">All months</option>'+months.map(m=>{const [y,mo]=m.split('-');const mn=new Date(y,+mo-1).toLocaleString('en',{month:'long'});return'<option value="'+m+'"'+(m===hoursState.filterMonth?' selected':'')+'>'+mn+' '+y+'</option>';}).join('');
  mSel.onchange=e=>{hoursState.filterMonth=e.target.value;renderHours();};mDiv.appendChild(mSel);filterRow.appendChild(mDiv);
  wrap.appendChild(filterRow);

  // Filter records
  let filtered=[...allH].filter(h=>h.status==='out'); // only completed sessions
  if(at&&hoursState.view==='my') filtered=filtered.filter(h=>h.teacher===at);
  if(hoursState.filterTeacher) filtered=filtered.filter(h=>h.teacher===hoursState.filterTeacher);
  if(hoursState.filterMonth) filtered=filtered.filter(h=>h.dateISO&&h.dateISO.startsWith(hoursState.filterMonth));
  filtered.sort((a,b)=>b.dateISO.localeCompare(a.dateISO)||b.clockIn.localeCompare(a.clockIn));

  // Summary stats
  const totalHours=filtered.reduce((s,h)=>s+(h.hoursWorked||0),0);
  const byTeacher={};filtered.forEach(h=>{byTeacher[h.teacher]=(byTeacher[h.teacher]||0)+(h.hoursWorked||0);});

  if(filtered.length>0){
    const statsBar=document.createElement('div');statsBar.style.cssText='display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;';
    const addStat=(val,lbl,col)=>{const s=document.createElement('div');s.style.cssText='background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:9px;padding:10px 14px;flex:1;min-width:100px;';s.innerHTML='<div style="font-size:22px;font-weight:700;color:'+col+';">'+val+'</div><div style="font-size:11px;color:#64748b;margin-top:2px;">'+lbl+'</div>';statsBar.appendChild(s);};
    addStat(filtered.length,'Sessions','#4f46e5');
    addStat(totalHours.toFixed(1)+'h','Total hours','#15803d');
    if(!at||hoursState.view==='all') addStat(Object.keys(byTeacher).length,'Teachers','#854d0e');
    wrap.appendChild(statsBar);
  }

  // Export CSV
  if(filtered.length>0){
    const expRow=document.createElement('div');expRow.style.cssText='display:flex;justify-content:flex-end;margin-bottom:10px;';
    const expBtn=document.createElement('button');expBtn.style.cssText='border:1.5px solid #e2e8f0;background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;color:#64748b;';
    expBtn.textContent='↓ Export CSV';expBtn.onclick=()=>exportHoursCSV(filtered);expRow.appendChild(expBtn);wrap.appendChild(expRow);
  }

  // Records table
  if(!filtered.length){
    const empty=document.createElement('div');empty.style.cssText='text-align:center;padding:32px;color:#94a3b8;font-size:14px;';empty.textContent='No completed sessions yet.';wrap.appendChild(empty);return;
  }

  // Group by date
  const byDate={};filtered.forEach(h=>{if(!byDate[h.dateISO])byDate[h.dateISO]=[];byDate[h.dateISO].push(h);});

  Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0])).forEach(([dateISO,entries])=>{
    const dateHdr=document.createElement('div');dateHdr.style.cssText='font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8;margin:12px 0 6px;';
    dateHdr.textContent=fmtDateEN(new Date(dateISO+'T12:00:00'));wrap.appendChild(dateHdr);

    const dayTotal=entries.reduce((s,h)=>s+(h.hoursWorked||0),0);

    entries.forEach(h=>{
      const card=document.createElement('div');card.style.cssText='border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;margin-bottom:6px;padding:11px 13px;';
      const row1=document.createElement('div');row1.style.cssText='display:flex;align-items:center;gap:10px;';
      const teacherBadge=document.createElement('span');teacherBadge.style.cssText='font-weight:600;font-size:13px;flex:1;';teacherBadge.textContent=h.teacher;row1.appendChild(teacherBadge);
      const timeSpan=document.createElement('span');timeSpan.style.cssText='font-size:13px;color:#64748b;';timeSpan.textContent=h.clockInDisplay+' → '+h.clockOutDisplay;row1.appendChild(timeSpan);
      const durBadge=document.createElement('span');durBadge.style.cssText='font-size:12px;font-weight:700;background:#eef2ff;color:#4f46e5;padding:3px 9px;border-radius:6px;flex-shrink:0;';durBadge.textContent=h.duration;row1.appendChild(durBadge);
      card.appendChild(row1);
      if(h.note){const noteDiv=document.createElement('div');noteDiv.style.cssText='font-size:12px;color:#64748b;margin-top:5px;font-style:italic;';noteDiv.textContent='📝 '+h.note;card.appendChild(noteDiv);}

      // Admin: manual edit/delete
      if(!at){
        const adminRow=document.createElement('div');adminRow.style.cssText='display:flex;gap:8px;margin-top:8px;justify-content:flex-end;';
        const editBtn=document.createElement('button');editBtn.style.cssText='border:1.5px solid #e2e8f0;background:#fff;border-radius:6px;padding:4px 10px;font-size:11px;font-family:inherit;cursor:pointer;color:#64748b;';editBtn.textContent='Edit';
        editBtn.onclick=()=>{
          const newIn=prompt('Clock-in time (HH:MM):',h.clockInDisplay);
          const newOut=prompt('Clock-out time (HH:MM):',h.clockOutDisplay);
          if(newIn&&newOut){
            const hrs=getHours();const idx=hrs.findIndex(x=>x.id===h.id);
            if(idx>=0){
              const base=new Date(h.dateISO+'T12:00:00');
              const [ih,im]=newIn.split(':');const [oh,om]=newOut.split(':');
              const inD=new Date(base);inD.setHours(+ih,+im,0);
              const outD=new Date(base);outD.setHours(+oh,+om,0);
              hrs[idx].clockIn=inD.toISOString();hrs[idx].clockInDisplay=newIn;
              hrs[idx].clockOut=outD.toISOString();hrs[idx].clockOutDisplay=newOut;
              hrs[idx].hoursWorked=calcDecimal(hrs[idx].clockIn,hrs[idx].clockOut);
              hrs[idx].duration=calcDuration(hrs[idx].clockIn,hrs[idx].clockOut);
              saveHours(hrs);renderHours();
            }
          }
        };
        const delBtn=document.createElement('button');delBtn.style.cssText='border:1.5px solid #fca5a5;background:#fff;border-radius:6px;padding:4px 10px;font-size:11px;font-family:inherit;cursor:pointer;color:#dc2626;';delBtn.textContent='Delete';
        delBtn.onclick=()=>{if(confirm('Delete this entry?')){const hrs=getHours().filter(x=>x.id!==h.id);saveHours(hrs);renderHours();}};
        adminRow.appendChild(editBtn);adminRow.appendChild(delBtn);card.appendChild(adminRow);
      }
      wrap.appendChild(card);
    });

    // Day total
    const dayTotalDiv=document.createElement('div');dayTotalDiv.style.cssText='text-align:right;font-size:12px;font-weight:700;color:#4f46e5;margin-bottom:4px;';dayTotalDiv.textContent='Day total: '+dayTotal.toFixed(1)+'h';wrap.appendChild(dayTotalDiv);
  });

  // Teacher totals summary (admin / all view)
  if((!at||hoursState.view==='all')&&Object.keys(byTeacher).length>1){
    const sumHdr=document.createElement('div');sumHdr.style.cssText='font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8;margin:16px 0 6px;';sumHdr.textContent='Summary by teacher';wrap.appendChild(sumHdr);
    const sumTable=document.createElement('div');sumTable.style.cssText='border:1.5px solid #e2e8f0;border-radius:10px;overflow:hidden;background:#fff;';
    Object.entries(byTeacher).sort((a,b)=>b[1]-a[1]).forEach(([t,h],i,arr)=>{
      const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:'+(i<arr.length-1?'1px solid #f1f5f9':'none')+';font-size:13px;';
      row.innerHTML='<span style="flex:1;font-weight:500;">'+t+'</span><span style="font-weight:700;color:#4f46e5;">'+h.toFixed(1)+'h</span>';
      sumTable.appendChild(row);
    });
    wrap.appendChild(sumTable);
  }
}

function exportHoursCSV(records){
  const rows=[['Teacher','Date','Clock In','Clock Out','Duration','Hours (decimal)','Note']];
  records.forEach(h=>rows.push([h.teacher,h.date,h.clockInDisplay,h.clockOutDisplay||'',h.duration||'',h.hoursWorked||'',h.note||'']));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='hours_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
}


// ── Messages tab (threaded conversations) ────────────────────────────────
async function saveMessages(msgs){
  acquireWriteLock(); // suppress SSE for 3s
  state.messages=msgs;
  lsSet('ewj-messages', msgs); // local cache immediately
  const obj={};msgs.forEach(m=>{ if(m&&m.id) obj['m'+m.id]=m; });
  try {
    const t=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000));
    await Promise.race([fetch(FB_URL+'/messages.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}),t]);
  } catch(e){ console.warn('Messages save failed:',e.message); }
}

async function deleteMessage(id){
  try {
    const t=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000));
    await Promise.race([fetch(FB_URL+'/messages/m'+id+'.json',{method:'DELETE'}),t]);
    state.messages=state.messages.filter(m=>m.id!==id);
  } catch(e){ console.warn('Message delete failed:',e.message); }
}

// msgState tracks which thread is open and reply drafts
const msgState={openThread:null,replyDraft:''};

function getMyName(){
  const at=state.activeTeacher;
  return at===''?'John (admin)':at;
}

function canSeeMessage(m){
  const me=getMyName();
  const at=state.activeTeacher;
  if(at==='') return true; // admin sees all
  if(m.from===me) return true;
  if(m.to===me) return true;
  if(m.to==='all') return true;
  // Check if I'm in the thread replies
  if((m.replies||[]).some(r=>r.from===me||r.to===me||m.to==='all')) return true;
  return false;
}

function isUnreadForMe(m){
  const me=getMyName();
  const at=state.activeTeacher;
  if(m.from===me) return false; // my own message
  if(at===''){
    // Admin: unread if adminRead is false and message/reply is to admin or from a teacher
    const hasUnreadReply=(m.replies||[]).some(r=>!r.adminRead&&r.from!==me);
    return (!m.adminRead&&m.from!==me)||hasUnreadReply;
  }
  if(m.to===me&&!m.read) return true;
  if(m.to==='all'&&!(m.readBy||{})[me]) return true;
  // Unread reply to me
  return (m.replies||[]).some(r=>(r.to===me||r.to==='all')&&r.from!==me&&!r.read);
}

function renderMessages(){
  const wrap=document.getElementById('tab-messages');
  if(!wrap)return;
  wrap.innerHTML='';
  const at=state.activeTeacher;
  const me=getMyName();
  const msgs=state.messages||[];

  // ── Compose new message ────────────────────────────────────────────────
  const compose=document.createElement('div');
  compose.style.cssText='background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:12px;padding:14px;margin-bottom:16px;';
  compose.innerHTML='<div class="lbl" style="margin-bottom:8px;">New Message</div>';

  const toRow=document.createElement('div');toRow.style.cssText='display:flex;gap:8px;margin-bottom:8px;align-items:center;';
  const toLbl=document.createElement('span');toLbl.style.cssText='font-size:12px;font-weight:600;color:#475569;flex-shrink:0;width:24px;';toLbl.textContent='To:';
  const toSel=document.createElement('select');toSel.style.cssText='flex:1;padding:7px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;outline:none;';
  const allRecipients=['all','admin',...['Anna','Chaymae','Clara','Ferran','John','Mary','Mireia'],'Reception'];
  const recipients=(at===''||at==='Reception')
    ?allRecipients.filter(r=>r!==(at===''?null:at))
    :['admin','all'];
  recipients.forEach(r=>{
    const o=document.createElement('option');o.value=r;
    o.textContent=r==='all'?'Everyone':r==='admin'?'John (admin)':r;
    toSel.appendChild(o);
  });
  toRow.appendChild(toLbl);toRow.appendChild(toSel);compose.appendChild(toRow);

  const msgIn=document.createElement('textarea');
  msgIn.style.cssText='width:100%;padding:9px 11px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;resize:none;min-height:68px;outline:none;display:block;margin-bottom:8px;';
  msgIn.placeholder='Type your message…';
  msgIn.onfocus=()=>msgIn.style.borderColor='#4f46e5';
  msgIn.onblur=()=>msgIn.style.borderColor='#e2e8f0';
  compose.appendChild(msgIn);

  const sendBtn=document.createElement('button');
  sendBtn.style.cssText='background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;';
  sendBtn.textContent='Send';
  sendBtn.onclick=async()=>{
    const text=msgIn.value.trim();if(!text)return;
    const now=new Date();
    const newMsg={id:Date.now(),from:me,to:toSel.value,text,sentAt:fmtD(now)+' '+fmtT(now),sentAtFull:now.toISOString(),read:false,adminRead:at==='',readBy:{},replies:[]};
    const updated=[...state.messages,newMsg];
    await saveMessages(updated);msgIn.value='';renderMessages();
  };
  compose.appendChild(sendBtn);wrap.appendChild(compose);

  // ── Message threads ────────────────────────────────────────────────────
  const visible=msgs.filter(canSeeMessage).sort((a,b)=>b.id-a.id);

  if(!visible.length){
    const empty=document.createElement('div');empty.style.cssText='text-align:center;padding:32px;color:#94a3b8;font-size:14px;';empty.textContent='No messages yet.';wrap.appendChild(empty);return;
  }

  // Mark messages as read after 1s
  setTimeout(async()=>{
    let changed=false;
    const upd=state.messages.map(m=>{
      if(!canSeeMessage(m))return m;
      let updated={...m,replies:[...(m.replies||[])]};
      if(at===''&&!m.adminRead&&m.from!==me){updated.adminRead=true;changed=true;}
      else if(at!==''&&m.to===me&&!m.read&&m.from!==me){updated.read=true;changed=true;}
      else if(at!==''&&m.to==='all'&&m.from!==me&&!(m.readBy||{})[me]){updated.readBy={...(m.readBy||{}),[me]:true};changed=true;}
      // Mark unread replies
      updated.replies=updated.replies.map(r=>{
        if(at===''&&!r.adminRead&&r.from!==me){changed=true;return{...r,adminRead:true};}
        if(at!==''&&(r.to===me||r.to==='all')&&!r.read&&r.from!==me){changed=true;return{...r,read:true};}
        return r;
      });
      return updated;
    });
    if(changed)await saveMessages(upd);
  },1500);

  visible.forEach(m=>{
    const isOwn=m.from===me;
    const unread=isUnreadForMe(m);
    const isOpen=msgState.openThread===m.id;
    const replies=m.replies||[];

    const card=document.createElement('div');
    card.style.cssText='border:1.5px solid '+(unread?'#c7d2fe':'#e2e8f0')+';border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff;';

    // Thread header
    const hdr=document.createElement('div');
    hdr.style.cssText='padding:12px 14px;cursor:pointer;background:'+(isOwn?'#eef2ff':unread?'#f8fafc':'#fff')+';';
    hdr.onclick=()=>{msgState.openThread=isOpen?null:m.id;renderMessages();};

    const hdrTop=document.createElement('div');hdrTop.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap;';
    hdrTop.innerHTML='<span style="font-weight:700;font-size:13px;color:#1e293b;">'+m.from+'</span>'
      +'<span style="font-size:11px;color:#94a3b8;">&#8594; '+(m.to==='all'?'Everyone':m.to==='admin'?'John (admin)':m.to)+'</span>'
      +(unread?'<span style="font-size:10px;background:#eef2ff;color:#4f46e5;padding:2px 7px;border-radius:20px;font-weight:700;flex-shrink:0;">NEW</span>':'')
      +'<span style="font-size:11px;color:#cbd5e1;margin-left:auto;">'+m.sentAt+'</span>';
    hdr.appendChild(hdrTop);

    const preview=document.createElement('div');preview.style.cssText='font-size:13px;color:#475569;'+(isOpen?'':'white-space:nowrap;overflow:hidden;text-overflow:ellipsis;');
    preview.textContent=m.text;hdr.appendChild(preview);

    if(replies.length){
      const rCount=document.createElement('div');rCount.style.cssText='font-size:11px;color:#94a3b8;margin-top:4px;';
      rCount.textContent=replies.length+' repl'+(replies.length===1?'y':'ies');hdr.appendChild(rCount);
    }
    card.appendChild(hdr);

    // Expanded thread
    if(isOpen){
      // Show all replies
      replies.forEach(r=>{
        const rDiv=document.createElement('div');
        const rIsOwn=r.from===me;
        rDiv.style.cssText='padding:10px 14px;border-top:1px solid #f1f5f9;background:'+(rIsOwn?'#f0fdf4':'#fff')+';';
        rDiv.innerHTML='<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px;">'
          +'<span style="font-weight:600;font-size:12px;color:'+(rIsOwn?'#15803d':'#4f46e5')+';">'+r.from+'</span>'
          +'<span style="font-size:11px;color:#94a3b8;">'+r.sentAt+'</span>'
          +'</div>'
          +'<div style="font-size:13px;color:#1e293b;">'+r.text+'</div>';
        card.appendChild(rDiv);
      });

      // Reply input
      const replyBox=document.createElement('div');
      replyBox.style.cssText='padding:10px 14px;border-top:1.5px solid #e2e8f0;background:#f8fafc;display:flex;gap:8px;align-items:flex-end;';
      const replyIn=document.createElement('textarea');
      replyIn.style.cssText='flex:1;padding:8px 10px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;resize:none;min-height:56px;outline:none;background:#fff;';
      replyIn.placeholder='Reply…';
      replyIn.value=msgState.replyDraft;
      replyIn.oninput=e=>{msgState.replyDraft=e.target.value;};
      replyIn.onfocus=()=>replyIn.style.borderColor='#4f46e5';
      replyIn.onblur=()=>replyIn.style.borderColor='#e2e8f0';

      const replyBtn=document.createElement('button');
      replyBtn.style.cssText='border:none;background:#4f46e5;color:#fff;border-radius:8px;padding:8px 16px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;';
      replyBtn.textContent='Reply';
      replyBtn.onclick=async()=>{
        const text=replyIn.value.trim();if(!text)return;
        const now=new Date();
        // Determine who to reply to (the original sender, or all if broadcast)
        const replyTo=m.to==='all'?'all':(m.from===me?m.to:m.from);
        const newReply={id:Date.now(),from:me,to:replyTo,text,sentAt:fmtD(now)+' '+fmtT(now),read:false,adminRead:at==='',readBy:{}};
        const upd=state.messages.map(x=>x.id===m.id?{...x,replies:[...(x.replies||[]),newReply]}:x);
        await saveMessages(upd);msgState.replyDraft='';renderMessages();
      };
      replyBox.appendChild(replyIn);replyBox.appendChild(replyBtn);card.appendChild(replyBox);

      // Admin delete thread
      if(at===''){
        const delBar=document.createElement('div');delBar.style.cssText='padding:6px 14px 10px;display:flex;justify-content:flex-end;background:#f8fafc;';
        const delBtn=document.createElement('button');delBtn.style.cssText='border:1.5px solid #fca5a5;background:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-family:inherit;cursor:pointer;color:#dc2626;';
        delBtn.textContent='Delete thread';
        delBtn.onclick=async()=>{
          if(!confirm('Delete this entire conversation?'))return;
          await deleteMessage(m.id);renderMessages();
        };
        delBar.appendChild(delBtn);card.appendChild(delBar);
      }
    }

    wrap.appendChild(card);
  });
}


// ── Feedback stored separately from records ──────────────────────────────
// This ensures feedback writes NEVER overwrite attendance records
async function saveFeedback(recordId, feedbackData){
  acquireWriteLock();
  try {
    const t=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000));
    await Promise.race([
      fetch(FB_URL+'/feedback/f'+recordId+'.json',{
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({...feedbackData, recordId})
      }),t
    ]);
    // Update local state immediately
    state.feedback=state.feedback||{};
    state.feedback[recordId]=feedbackData;
    lsSet('ewj-feedback', state.feedback);
  } catch(e){ console.warn('Feedback save failed:',e.message); }
}

async function loadFeedback(){
  try {
    const t=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000));
    const res=await Promise.race([fetch(FB_URL+'/feedback.json'),t]);
    if(!res.ok)return;
    const data=await res.json();
    if(!data)return;
    // data is {f123: {adminFeedback:..., teacherReply:...}, ...}
    const fb={};
    Object.values(data).forEach(f=>{if(f&&f.recordId)fb[f.recordId]=f;});
    state.feedback=fb;
    lsSet('ewj-feedback',fb);
  } catch(e){ state.feedback=lsGet('ewj-feedback',{}); }
}

function mergeFeedbackIntoRecords(){
  if(!state.feedback)return;
  state.records=state.records.map(r=>{
    const fb=state.feedback[r.id];
    if(!fb)return r;
    return{...r,
      adminFeedback:fb.adminFeedback||r.adminFeedback||'',
      adminFeedbackAt:fb.adminFeedbackAt||r.adminFeedbackAt||null,
      adminFeedbackRead:fb.adminFeedbackRead!==undefined?fb.adminFeedbackRead:r.adminFeedbackRead,
      teacherReply:fb.teacherReply||r.teacherReply||'',
      teacherReplyAt:fb.teacherReplyAt||r.teacherReplyAt||null,
      teacherReplyRead:fb.teacherReplyRead!==undefined?fb.teacherReplyRead:r.teacherReplyRead,
    };
  });
}


function fbSubscribe_feedback(){
  try {
    const es=new EventSource(FB_URL+'/feedback.json');
    es.addEventListener('put', e=>{
      try {
        const msg=JSON.parse(e.data);
        const data=msg.data;
        if(!data)return;
        const fb={};
        Object.values(data).forEach(f=>{if(f&&f.recordId)fb[f.recordId]=f;});
        state.feedback=fb;
        lsSet('ewj-feedback',fb);
        mergeFeedbackIntoRecords();
        if(state.tab==='log')renderLog();
        else renderTabBar();
      } catch(err){}
    });
  } catch(e){ console.warn('Feedback SSE failed:',e); }
}


// ── One-time migration: clean and deduplicate Firebase records ────────────
async function migrateAndCleanRecords(){
  if(!state.records.length) return;
  
  // Deduplicate: keep record with most content for each class slot
  const seen={};
  state.records.forEach(r=>{
    if(!r||!r.id||!r.teacher) return;
    const k=(r.teacher||'')+'|'+(r.day||'')+'|'+(r.time||'')+'|'+(r.date||'')+'|'+(r.course||'');
    if(!seen[k]){
      seen[k]=r;
    } else {
      // Keep whichever has more data
      const prev=seen[k];
      const prevScore=(prev.comment?2:0)+(prev.adminFeedback?1:0)+(prev.students&&prev.students.length?1:0);
      const currScore=(r.comment?2:0)+(r.adminFeedback?1:0)+(r.students&&r.students.length?1:0);
      if(currScore>prevScore||(currScore===prevScore&&r.id>prev.id)){
        seen[k]=r;
      }
    }
  });
  
  const clean=Object.values(seen).sort((a,b)=>(a.id||0)-(b.id||0));
  const removed=state.records.length-clean.length;
  
  if(removed>0){
    console.log('Migration: removed',removed,'duplicates, keeping',clean.length,'records');
    state.records=clean;
    lsSet('ewj-records',clean);
    
    // Write clean records back to Firebase as a proper object
    // This REPLACES the entire records node, clearing old array format
    try {
      const obj={};
      clean.forEach(r=>{ if(r&&r.id) obj['r'+r.id]=r; });
      const t=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),10000));
      await Promise.race([
        fetch(FB_URL+'/records.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}),
        t
      ]);
      console.log('Migration complete: Firebase records cleaned');
    } catch(e){
      console.warn('Migration write failed:',e.message);
    }
  } else {
    console.log('No duplicates found, records are clean');
  }
}
