<title>Attendance Register – English with John</title>
<style>
:root{--accent:#4f46e5;--accent-dark:#3730a3;--accent-light:#eef2ff;--green:#16a34a;--gl:#dcfce7;--red:#dc2626;--rl:#fee2e2;--amber:#d97706;--al:#fef9c3;--orange:#ea580c;--ol:#ffedd5;--gray-50:#f8fafc;--gray-100:#f1f5f9;--gray-200:#e2e8f0;--gray-400:#94a3b8;--gray-600:#475569;--gray-800:#1e293b;--r:10px;--rl2:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#fff;color:var(--gray-800);font-size:15px;line-height:1.5;}
#app{max-width:600px;margin:0 auto;padding:20px 16px 60px;}
.lbl{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gray-400);margin-bottom:5px;}
.card{background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:var(--rl2);padding:14px;margin-bottom:12px;}
select,input[type=text],input[type=date]{width:100%;padding:9px 11px;border:1.5px solid var(--gray-200);border-radius:var(--r);font-size:14px;font-family:inherit;background:#fff;outline:none;color:var(--gray-800);-webkit-appearance:none;appearance:none;}
select:focus,input[type=text]:focus,input[type=date]:focus{border-color:var(--accent);}
.tab-bar{display:flex;gap:3px;background:var(--gray-100);border-radius:var(--r);padding:3px;margin-bottom:18px;}
.tab{flex:1;padding:7px 4px;border:none;background:transparent;border-radius:7px;font-size:11px;font-family:inherit;cursor:pointer;font-weight:500;color:var(--gray-600);transition:all .13s;white-space:nowrap;}
.tab.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.tc{display:inline-flex;align-items:center;border:1.5px solid var(--gray-200);background:#fff;border-radius:20px;padding:5px 12px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:500;color:var(--gray-600);margin:3px;transition:all .13s;}
.tc:hover{border-color:var(--accent);color:var(--accent);}
.tc.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.slot{border:1.5px solid var(--gray-200);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:#fff;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;transition:all .13s;}
.slot:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
.slot.on{border-color:var(--accent);background:var(--accent-light);}
.bdg{font-size:11px;padding:3px 7px;border-radius:6px;font-weight:600;flex-shrink:0;white-space:nowrap;}
.stu{border:1.5px solid var(--gray-200);border-radius:var(--r);background:#fff;margin-bottom:6px;overflow:hidden;transition:background .1s;}
.stu.present{background:#f0fdf4;border-color:#86efac;}
.stu.absent{background:var(--rl);border-color:#fca5a5;}
.stu.late{background:var(--ol);border-color:#fdba74;}
.stu.dropped{opacity:.45;background:var(--rl)!important;border-color:#fca5a5!important;}
.stu.newstu{background:#f0fdf4!important;border-color:#86efac!important;}
.stu-top{display:flex;align-items:center;gap:7px;padding:8px 11px 5px;}
.stu-bot{display:flex;align-items:center;gap:6px;padding:0 11px 8px;flex-wrap:wrap;}
.stu-name{flex:1;font-weight:500;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb{border:none;border-radius:6px;padding:5px 11px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:700;flex-shrink:0;transition:all .1s;}
.sb.p{background:var(--gl);color:var(--green);}
.sb.p.on{background:var(--green);color:#fff;}
.sb.a{background:var(--rl);color:var(--red);}
.sb.a.on{background:var(--red);color:#fff;}
.sb.l{background:var(--ol);color:var(--orange);}
.sb.l.on{background:var(--orange);color:#fff;}
.sb:disabled{opacity:.3;}
.ni{flex:1;min-width:80px;max-width:130px;padding:5px 8px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:12px;font-family:inherit;outline:none;}
.ni:focus{border-color:var(--accent);}
.fb{border:none;border-radius:20px;padding:3px 9px;font-size:11px;font-family:inherit;cursor:pointer;font-weight:600;flex-shrink:0;background:var(--gray-100);color:var(--gray-600);}
.fb.dropped{background:var(--rl);color:var(--red);text-decoration:line-through;}
.fb.newstu{background:var(--gl);color:var(--green);}
.absbdg{font-size:10px;background:var(--rl);color:var(--red);padding:1px 6px;border-radius:20px;font-weight:700;flex-shrink:0;}
.submit-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:12px;transition:background .13s;}
.submit-btn:hover{background:var(--accent-dark);}
.add-row{display:flex;gap:7px;margin-top:6px;}
.add-row input{flex:1;}
.add-btn{border:none;border-radius:9px;background:var(--accent);color:#fff;padding:0 14px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;height:40px;white-space:nowrap;}
.ctr{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700;}
.ctr.p{background:var(--gl);color:var(--green);}
.ctr.a{background:var(--rl);color:var(--red);}
.ctr.l{background:var(--ol);color:var(--orange);}
.success{background:#f0fdf4;border:1.5px solid #86efac;border-radius:var(--rl2);padding:22px;text-align:center;}
.log-card{border:1.5px solid var(--gray-200);border-radius:11px;margin-bottom:8px;overflow:hidden;background:#fff;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.stat{background:var(--gray-50);border:1.5px solid var(--gray-200);border-radius:var(--r);padding:12px;text-align:center;}
.mgmt-card{border:1.5px solid var(--gray-200);border-radius:var(--r);padding:12px 13px;margin-bottom:7px;background:#fff;}
.mv-sel{flex:1;padding:5px 7px;font-size:12px;border:1.5px solid var(--gray-200);border-radius:6px;background:#fff;font-family:inherit;outline:none;}
.mv-sel:focus{border-color:var(--accent);}
.pill{border:1.5px solid var(--gray-200);background:#fff;border-radius:7px;padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:600;color:var(--gray-600);}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  @media(max-width:480px){
    .tab{font-size:10px;padding:6px 2px;}
    .stat-grid{grid-template-columns:1fr 1fr;}
    #app{padding:14px 10px 60px;}
    .sb{padding:5px 8px;font-size:12px;}
    .stu-name{font-size:12px;}
    .log-card .hdr{flex-wrap:wrap;}
  }
</style>
</head>

// ── Storage (Firebase REST API + localStorage) ───────────────────────────
// No SDK needed — Firebase's REST API works with plain fetch() in any browser/iframe
// localStorage = PIN, session, active-teacher (device-local only)
// Firebase = records, schedule, hours (shared across all devices in real time)

const FB_URL = 'https://emglish-with-john-default-rtdb.europe-west1.firebasedatabase.app';
const SHEETS_URL = ''; // paste your Apps Script Web App URL here

function lsGet(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

// Map storage keys to Firebase REST paths
function fbPath(k){
  const map={'ewj-records':'records','ewj-schedule':'schedule','ewj-hours':'hours','ewj-messages':'messages'};
  return map[k]||null;
}

// Read from Firebase (5s timeout)
async function fbGet(k, fallback){
  const path=fbPath(k);
  if(!path) return lsGet(k, fallback);
  try {
    const t=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000));
    const res=await Promise.race([fetch(FB_URL+'/'+path+'.json'),t]);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data===null||data===undefined) return fallback;
    // Records are stored as {r123: {...}, r456: {...}} — convert to array and sort by id
    if(Array.isArray(data)) return data;
    const arr=Object.values(data).filter(x=>x&&typeof x==='object'&&Object.keys(x).length>0);
    if(k==='ewj-records') arr.sort((a,b)=>(a.id||0)-(b.id||0));
    return arr.length?arr:fallback;
  } catch(e){ console.warn('FB read failed:',e.message); return lsGet(k,fallback); }
}

// Write to Firebase — each record written individually to prevent overwrites
async function fbSet(k, v){
  const path=fbPath(k);
  if(!path){ lsSet(k,v); return; }
  lsSet(k,v);
  try {
    const t=new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000));
    if(k==='ewj-records'&&Array.isArray(v)){
      // Write each record individually — NEVER bulk PUT the whole records node
      // This ensures no write can delete other teachers' records
      await Promise.all(v.filter(r=>r&&r.id).map(r=>
        Promise.race([
          fetch(FB_URL+'/records/r'+r.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(r)}),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000))
        ])
      ));
    } else {
      const res=await Promise.race([
        fetch(FB_URL+'/'+path+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)}),t
      ]);
      if(!res.ok) throw new Error('HTTP '+res.status);
    }
  } catch(e){ console.warn('FB write failed:',e.message); }
}

// Delete a single record from Firebase
async function fbDeleteRecord(id){
  try {
    await fetch(FB_URL+'/records/r'+id+'.json',{method:'DELETE'});
  } catch(e){ console.warn('FB delete failed:',e.message); }
}

// Real-time subscription using Firebase Server-Sent Events (SSE)
// Calls cb(value) whenever data changes on ANY device
function fbSubscribe(k, cb){
  const path=fbPath(k);
  if(!path) return;
  try {
    const es = new EventSource(FB_URL+'/'+path+'.json', {withCredentials:false});
    es.addEventListener('put', e => {
      try {
        const msg = JSON.parse(e.data);
        const val = msg.data;
        if(val !== null){
          const arr = Array.isArray(val) ? val : Object.values(val);
          cb(arr);
        }
      } catch(err){ console.warn('SSE parse error:', err); }
    });
    es.onerror = () => {
      // SSE reconnects automatically — no action needed
    };
    return es;
  } catch(e){
    console.warn('SSE not available:', e);
  }
}


// ── Admin password ────────────────────────────────────────────────────────
const ADMIN_PIN_KEY = 'ewj-admin-pin';
const ADMIN_SESSION_KEY = 'ewj-admin-session';

function getAdminPin(){return lsGet(ADMIN_PIN_KEY, null);}
function setAdminPin(pin){lsSet(ADMIN_PIN_KEY, pin);}
function isAdminSessionActive(){
  const s = lsGet(ADMIN_SESSION_KEY, null);
  if(!s) return false;
  // Session lasts 8 hours
  return (Date.now() - s) < 8 * 60 * 60 * 1000;
}
function startAdminSession(){lsSet(ADMIN_SESSION_KEY, Date.now());}
function clearAdminSession(){localStorage.removeItem(ADMIN_SESSION_KEY);}

function promptAdminAccess(onSuccess){
  const pin = getAdminPin();
  if(!pin){
    // First time — set a PIN
    const newPin = prompt('Set an admin PIN (4+ digits):');
    if(!newPin || newPin.trim().length < 4){ alert('PIN must be at least 4 digits. Access denied.'); return; }
    const confirm_ = prompt('Confirm PIN:');
    if(newPin !== confirm_){ alert('PINs do not match. Try again.'); return; }
    setAdminPin(newPin.trim());
    startAdminSession();
    onSuccess();
    return;
  }
  if(isAdminSessionActive()){ onSuccess(); return; }
  const entered = prompt('Enter admin PIN:');
  if(!entered){ return; }
  if(entered.trim() === pin){ startAdminSession(); onSuccess(); }
  else { alert('Incorrect PIN.'); }
}

// Boot: load from Firebase then subscribe to live updates
async function bootFromFirebase(){
  document.getElementById('app').innerHTML = '<div style="text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px;"><div style="font-size:32px;margin-bottom:12px;">📋</div>Loading…</div>';

  // Load all data in parallel including feedback
  const [fbRecords, fbSchedule, fbHours, fbMessages] = await Promise.all([
    fbGet('ewj-records',   []),
    fbGet('ewj-schedule',  BASE_SCHEDULE.map(s=>({...s,students:[...(s.students||[])]}))),
    fbGet('ewj-hours',     []),
    fbGet('ewj-messages',  []),
  ]);
  // Load feedback separately (non-blocking)
  loadFeedback().catch(e=>console.warn('Feedback load failed:',e));

  const rawRecords = Array.isArray(fbRecords) ? fbRecords : Object.values(fbRecords || {});
  const cleanRecords = rawRecords.filter(r=>r&&r.id&&r.teacher).sort((a,b)=>(a.id||0)-(b.id||0));
  const cachedRecords = lsGet('ewj-records', []).filter(r=>r&&r.id&&r.teacher);
  // Use whichever has more records
  state.records = cleanRecords.length >= cachedRecords.length ? cleanRecords : cachedRecords;
  console.log('Records loaded - Firebase:', cleanRecords.length, 'Cache:', cachedRecords.length, 'Using:', state.records.length);
  // If Firebase was empty but we have local records, restore them to Firebase
  if(cleanRecords.length===0 && state.records.length>0){
    console.log('Restoring records to Firebase...');
    // Deduplicate before restoring - keep record with most content per slot
    const seen={};
    state.records.forEach(r=>{
      if(!r||!r.id||!r.teacher)return;
      const k=r.teacher+'|'+r.day+'|'+r.time+'|'+r.date+'|'+r.course;
      if(!seen[k]||(r.comment&&!seen[k].comment)) seen[k]=r;
    });
    const deduped=Object.values(seen);
    state.records=deduped;
    lsSet('ewj-records',deduped);
    const obj={};deduped.forEach(r=>{if(r&&r.id)obj['r'+r.id]=r;});
    fetch(FB_URL+'/records.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}).then(()=>console.log('Records restored:',deduped.length)).catch(e=>console.warn('Restore failed:',e));
  }
  state.schedule = Array.isArray(fbSchedule) ? fbSchedule : Object.values(fbSchedule || {});
  state.hours    = Array.isArray(fbHours)    ? fbHours    : Object.values(fbHours    || {});
  const rawMsgs = Array.isArray(fbMessages) ? fbMessages : Object.values(fbMessages || {});
  state.messages = rawMsgs.length ? rawMsgs : lsGet('ewj-messages',[]);
  mergeFeedbackIntoRecords(); // merge feedback into records
  state.loaded   = true;

  // Re-build the app shell
  buildAppShell();
  renderAll();

  // Show live indicator
  const ld=document.getElementById('live-dot');
  if(ld){ld.style.display='inline';ld.style.color='#16a34a';ld.textContent='● Live';}

  // Subscribe to live updates — re-render when any device changes data
  // Poll records every 30 seconds instead of SSE (more reliable)
  setInterval(async()=>{
    if(_writeLock) return; // don't poll during writes
    try {
      const data = await fbGet('ewj-records', null);
      if(!data||!data.length) return; // never replace with empty
      state.records = data;
      lsSet('ewj-records', data);
      mergeFeedbackIntoRecords();
      if(state.tab==='log'||state.tab==='dashboard') renderAll();
      else renderTabBar();
    } catch(e){}
  }, 30000);

  fbSubscribe('ewj-schedule', val => {
    const arr = Array.isArray(val) ? val : Object.values(val || {});
    state.schedule = arr;
    lsSet('ewj-schedule', arr);
    if(state.tab==='register'||state.tab==='manage') renderAll();
  });

  // Subscribe to feedback changes
  fbSubscribe_feedback();

  fbSubscribe('ewj-messages', val => {
    if(_writeLock){console.log('Messages SSE suppressed during write');return;}
    const arr = Array.isArray(val) ? val : Object.values(val || {});
    state.messages = arr;
    if(state.tab==='messages') renderMessages();
    else renderTabBar();
  });

  fbSubscribe('ewj-hours', val => {
    const arr = Array.isArray(val) ? val : Object.values(val || {});
    state.hours = arr;
    lsSet('ewj-hours', arr);
    if(state.tab==='hours') renderHours();
  });
}

      if(isNaN(rw)||tw-rw>4)return; // only last 4 weeks
    }
    (r.students||[]).forEach(s=>{
      if(s.status==='absent'&&s.flag!=='dropped') m[s.name]=(m[s.name]||0)+1;

}

const reg={
  teacher:'', dateVal:todayISO(), slotIdx:null,
  status:{}, notes:{}, flags:{}, added:[],
  newName:'', submitted:false, editingId:null,
  planningMode:false, planningTime:'', planningNote:''
};

function getDay(dateVal){return DAYS[Math.min(new Date(dateVal+'T12:00:00').getDay()-1,4)]||'Monday';}
function getWeek(dateVal){return weekNum(new Date(dateVal+'T12:00:00'));}
function getDateStr(dateVal){return fmtD(new Date(dateVal+'T12:00:00'));}

function getSlots(){
  const tname=state.activeTeacher||reg.teacher;
  const day=getDay(reg.dateVal);
  return state.schedule.filter(s=>s.day===day&&(!tname||s.teacher===tname))
    .sort((a,b)=>a.time.localeCompare(b.time)||a.teacher.localeCompare(b.teacher));
}

function pickSlot(i){
  reg.slotIdx=i;reg.submitted=false;
  const s=getSlots()[i];
  const day=getDay(reg.dateVal),dateStr=getDateStr(reg.dateVal);
  const ex=state.records.find(r=>r.teacher===s.teacher&&r.day===day&&r.time===s.time&&r.date===dateStr);
  if(ex){
    const st={},fl={},nt={};
    (ex.students||[]).forEach(x=>{st[x.name]=x.status==='dropped'?'absent':x.status;if(x.flag)fl[x.name]=x.flag;if(x.note)nt[x.name]=x.note;});
    reg.status=st;reg.flags=fl;reg.notes=nt;reg.added=(ex.students||[]).filter(x=>x.flag==='new').map(x=>x.name);reg.editingId=ex.id;
  } else {
    const st={};(s.students||[]).forEach(n=>{st[n]='present';});
    reg.status=st;reg.flags={};reg.notes={};reg.added=[];reg.editingId=null;
  }
}

function setStu(n,v){
  reg.status[n]=v;
  if(v==='present')delete reg.notes[n];
  renderRegister();
}
function setFlag(n,f){
  reg.flags[n]=f;
  if(f==='dropped'){reg.status[n]='absent';reg.notes[n]='left';}
  renderRegister();
}
function clearFlag(n){
  const wasNew=reg.flags[n]==='new';
  delete reg.flags[n];
  if(wasNew){reg.added=reg.added.filter(a=>a!==n);delete reg.status[n];delete reg.notes[n];}
  else{reg.status[n]='present';delete reg.notes[n];}
  renderRegister();
}
function addStudent(){
  const name=reg.newName.trim();
  const allStu=getAllStu();
  if(!name||allStu.some(x=>x.toLowerCase()===name.toLowerCase()))return;
  reg.added.push(name);reg.status[name]='present';reg.flags[name]='new';reg.newName='';
  renderRegister();
}
function getAllStu(){
  const s=getSlots()[reg.slotIdx];
  return s?[...(s.students||[]),...reg.added]:[];
}

async function submitReg(){
  const now=new Date();
  const s=getSlots()[reg.slotIdx];
  const day=getDay(reg.dateVal),dateStr=getDateStr(reg.dateVal),week=getWeek(reg.dateVal);
  const allStu=getAllStu();
  const entry={id:reg.editingId||Date.now(),teacher:s.teacher,day,time:s.time,course:s.course,
    week:'Week '+week,date:dateStr,submittedAt:fmtT(now),submittedAtFull:now.toISOString(),
    comment:'',commentDone:false,commentAt:null,
    students:allStu.map(n=>({name:n,status:reg.flags[n]==='dropped'?'dropped':(reg.status[n]||'present'),note:reg.notes[n]||'',flag:reg.flags[n]||''}))};
  if(reg.editingId){const ex=state.records.find(r=>r.id===reg.editingId);if(ex){entry.comment=ex.comment;entry.commentDone=ex.commentDone;entry.commentAt=ex.commentAt;}}
  // Update local state immediately — no bulk Firebase write
  if(reg.editingId){
    state.records=state.records.map(r=>r.id===reg.editingId?entry:r);
  } else {
    state.records=[...state.records,entry];
  }
  lsSet('ewj-records',state.records);
  acquireWriteLock();
  // Write ONLY this one record to Firebase by its ID
  try{
    const t=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000));
    await Promise.race([
      fetch(FB_URL+'/records/r'+entry.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(entry)}),t
    ]);
  }catch(e){console.warn('Record save failed:',e.message);}
  // Auto-submit to Google Sheets (if SHEETS_URL is set)
  if(SHEETS_URL){
    fetch(SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({type:'attendance',...entry})}).catch(()=>{});
  }
  reg.submitted=true;renderRegister();renderTabBar();
}

function exportCSV(filteredRecs){
  const rows=[['Week','Date','Time sent','Teacher','Day','Class time','Course','Student','Status','Note','Class comment','Comment time','Flag']];

  source.forEach(r=>(r.students||[]).forEach(s=>rows.push([r.week,r.date,r.submittedAt||'',r.teacher,r.day,r.time,r.course,s.name,s.status,s.note,r.comment||'',r.commentAt||'',s.flag||''])));
  const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,\uFEFF'+encodeURIComponent(csv);a.download='assistencia_'+new Date().toISOString().slice(0,10)+'.csv';a.click();

      if(isN){const nb=document.createElement('span');nb.style.cssText='font-size:10px;background:#dcfce7;color:#15803d;padding:2px 6px;border-radius:20px;font-weight:700;flex-shrink:0;';nb.textContent='NEW';top.appendChild(nb);}
      const nm=document.createElement('span');nm.className='stu-name';nm.textContent=n;top.appendChild(nm);
      if(ta>0&&!isD){const ab=document.createElement('span');ab.className='absbdg';ab.textContent=ta+'A';top.appendChild(ab);}
      if(isD){const bl=document.createElement('span');bl.style.cssText='font-size:11px;color:#b91c1c;flex-shrink:0;';bl.textContent='left';top.appendChild(bl);}
      const fb=document.createElement('button');fb.className='fb'+(isD?' dropped':isN?' newstu':'');fb.style.marginLeft='auto';fb.textContent=isD?'↩':isN?'✕':'Drop';
      fb.onclick=()=>isD||isN?clearFlag(n):setFlag(n,'dropped');top.appendChild(fb);
      row.appendChild(top);
      const bot=document.createElement('div');bot.className='stu-bot';
      ['p','l','a'].forEach(type=>{
        const btn=document.createElement('button');btn.className='sb '+type+((s===({p:'present',l:'late',a:'absent'}[type])&&!isD)?' on':'');
        btn.textContent=type.toUpperCase();btn.disabled=isD;
        btn.onclick=()=>setStu(n,{p:'present',l:'late',a:'absent'}[type]);
        bot.appendChild(btn);
      });
      if(s!=='present'&&!isD){
        const ni=document.createElement('input');ni.type='text';ni.className='ni';ni.placeholder='note…';ni.value=reg.notes[n]||'';
        ni.oninput=e=>{reg.notes[n]=e.target.value;};bot.appendChild(ni);
        // Quick absence chips
        const absChips=['Illness','Family','No contact','Exam','Trip','Work'];
        const chipsWrap=document.createElement('div');chipsWrap.style.cssText='display:flex;gap:4px;flex-wrap:wrap;padding:4px 11px 6px;';
        absChips.forEach(c=>{
          const cb=document.createElement('button');
          cb.style.cssText='border:1px solid #e2e8f0;background:#f8fafc;border-radius:20px;padding:2px 8px;font-size:10px;color:#64748b;cursor:pointer;font-family:inherit;';
          cb.textContent=c;
          cb.onclick=()=>{reg.notes[n]=c;ni.value=c;};
          chipsWrap.appendChild(cb);
        });
        row.appendChild(chipsWrap);
      }
      row.appendChild(bot);wrap.appendChild(row);
    });

    // Add student
    const addRow=document.createElement('div');addRow.className='add-row';
    const addIn=document.createElement('input');addIn.type='text';addIn.placeholder='Add new student…';addIn.value=reg.newName;
    addIn.oninput=e=>{reg.newName=e.target.value;};addIn.onkeydown=e=>{if(e.key==='Enter')addStudent();};addRow.appendChild(addIn);
    const addBtn=document.createElement('button');addBtn.className='add-btn';addBtn.textContent='+ Add';addBtn.onclick=addStudent;addRow.appendChild(addBtn);wrap.appendChild(addRow);

    // Submit
    const sub=document.createElement('button');sub.className='submit-btn';sub.textContent=(reg.editingId?'Update':'Save')+' register →';sub.onclick=submitReg;wrap.appendChild(sub);
  }
}

// ── Log tab ───────────────────────────────────────────────────────────────
const logState={search:'',editing:null,draft:'',expanded:null,editingStudents:null,filterTeacher:'',filterDay:'',filterWeek:''};

function renderLog(){
  const wrap=document.getElementById('tab-log');wrap.innerHTML='';
  const at=state.activeTeacher;
  let recs=[...state.records];
  if(at)recs=recs.filter(r=>r.teacher===at);
  if(logState.filterTeacher) recs=recs.filter(r=>r.teacher===logState.filterTeacher);
  if(logState.filterDay)     recs=recs.filter(r=>r.day===logState.filterDay);
  if(logState.filterWeek)    recs=recs.filter(r=>r.week===logState.filterWeek);
  if(logState.search.trim()){
    const q=logState.search.toLowerCase();
    recs=recs.filter(r=>r.teacher.toLowerCase().includes(q)||r.course.toLowerCase().includes(q)||r.students.some(s=>s.name.toLowerCase().includes(q)));
  }
  recs.sort((a,b)=>{const tc=a.teacher.localeCompare(b.teacher);return tc!==0?tc:b.id-a.id;});
  const pending=state.records.filter(r=>!r.commentDone&&(!at||r.teacher===at)).length;

  // Search + header
  const sRow=document.createElement('div');sRow.style.cssText='display:flex;gap:8px;margin-bottom:10px;';
  const sIn=document.createElement('input');sIn.type='text';sIn.placeholder='Search student, teacher, class…';sIn.value=logState.search;sIn.style.flex='1';sIn.style.padding='8px 11px';sIn.style.fontSize='13px';
  sIn.oninput=e=>{logState.search=e.target.value;renderLog();};sRow.appendChild(sIn);
  if(logState.search){const clr=document.createElement('button');clr.className='pill';clr.textContent='✕';clr.onclick=()=>{logState.search='';renderLog();};sRow.appendChild(clr);}
  wrap.appendChild(sRow);

  // ── Filter bar ───────────────────────────────────────────────────────
  const filterBar=document.createElement('div');
  filterBar.style.cssText='display:grid;grid-template-columns:'+(at?'1fr 1fr':'1fr 1fr 1fr')+';gap:7px;margin-bottom:10px;';

  // Teacher filter (admin only)
  if(!at){
    const tDiv=document.createElement('div');
    const tSel=document.createElement('select');tSel.style.cssText='width:100%;padding:7px 9px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:inherit;background:#fff;outline:none;';
    tSel.innerHTML='<option value="">All teachers</option>'+TEACHERS.map(t=>'<option'+(t===logState.filterTeacher?' selected':'')+'>'+t+'</option>').join('');
    tSel.onchange=e=>{logState.filterTeacher=e.target.value;renderLog();};
    tDiv.appendChild(tSel);filterBar.appendChild(tDiv);
  }

  // Day filter
  const dDiv=document.createElement('div');
  const dSel=document.createElement('select');dSel.style.cssText='width:100%;padding:7px 9px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:inherit;background:#fff;outline:none;';
  dSel.innerHTML='<option value="">All days</option>'+DAYS.map(d=>'<option'+(d===logState.filterDay?' selected':'')+'>'+d+'</option>').join('');
  dSel.onchange=e=>{logState.filterDay=e.target.value;renderLog();};
  dDiv.appendChild(dSel);filterBar.appendChild(dDiv);

  // Week filter — build from existing records
  const weeks=[...new Set(state.records.map(r=>r.week).filter(Boolean))].sort((a,b)=>{
    const na=parseInt(a.replace('Week ','')),nb=parseInt(b.replace('Week ',''));return nb-na;
  });
  const wDiv=document.createElement('div');
  const wSel=document.createElement('select');wSel.style.cssText='width:100%;padding:7px 9px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:12px;font-family:inherit;background:#fff;outline:none;';
  wSel.innerHTML='<option value="">All weeks</option>'+weeks.map(w=>'<option'+(w===logState.filterWeek?' selected':'')+'>'+w+'</option>').join('');
  wSel.onchange=e=>{logState.filterWeek=e.target.value;renderLog();};
  wDiv.appendChild(wSel);filterBar.appendChild(wDiv);

  wrap.appendChild(filterBar);

  // Note for teachers
  if(at){
    const note=document.createElement('div');
    note.style.cssText='font-size:11px;color:#94a3b8;margin-bottom:8px;';
    note.textContent='Showing your records only. Use Day and Week filters to narrow down.';
    wrap.appendChild(note);
  }

  // Active filters summary + clear button
  const activeFilters=[logState.filterTeacher,logState.filterDay,logState.filterWeek].filter(Boolean);
  if(activeFilters.length){
    const clearRow=document.createElement('div');clearRow.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;';
    activeFilters.forEach(f=>{
      const tag=document.createElement('span');tag.style.cssText='background:#eef2ff;color:#4f46e5;border:1px solid #c7d2fe;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;';tag.textContent=f;clearRow.appendChild(tag);
    });
    const clrAll=document.createElement('button');clrAll.style.cssText='border:none;background:none;color:#94a3b8;font-size:12px;font-family:inherit;cursor:pointer;margin-left:auto;';clrAll.textContent='Clear filters';
    clrAll.onclick=()=>{logState.filterTeacher='';logState.filterDay='';logState.filterWeek='';renderLog();};
    clearRow.appendChild(clrAll);wrap.appendChild(clearRow);
  }

  const hdr=document.createElement('div');hdr.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:12px;';
  hdr.innerHTML='<span style="font-size:13px;color:#64748b">'+recs.length+' record'+(recs.length!==1?'s':'')+'</span>';
  if(pending>0){const pb=document.createElement('span');pb.style.cssText='background:#fef9c3;color:#854d0e;border:1px solid #fde047;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;';pb.textContent='✏️ '+pending+' without comment';hdr.appendChild(pb);}
  const csvBtn=document.createElement('button');csvBtn.style.cssText='margin-left:auto;border:1.5px solid #e2e8f0;background:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;color:#64748b;';csvBtn.textContent='↓ CSV'+(activeFilters.length?' (filtered)':'');csvBtn.onclick=()=>exportCSV(recs);hdr.appendChild(csvBtn);
  wrap.appendChild(hdr);

  if(!state.records.length){wrap.innerHTML+='<div style="text-align:center;padding:40px;color:#94a3b8;font-size:14px;">No records saved yet.</div>';return;}

  // Student profile view — if search matches a single student, show their summary
  if(logState.search.trim().length>=2){
    const q=logState.search.toLowerCase().trim();
    const matchedStudents=[...new Set(state.records.flatMap(r=>(r.students||[]).map(s=>s.name)).filter(n=>n.toLowerCase().includes(q)))];
    if(matchedStudents.length===1){
      const sName=matchedStudents[0];
      const sRecs=state.records.filter(r=>(r.students||[]).some(s=>s.name===sName)).map(r=>({...r,stu:(r.students||[]).find(s=>s.name===sName)}));
      const totalAbs=sRecs.filter(r=>r.stu.status==='absent'&&r.stu.flag!=='dropped').length;
      const totalLate=sRecs.filter(r=>r.stu.status==='late').length;
      const totalClasses=sRecs.filter(r=>r.stu.flag!=='dropped').length;
      const profile=document.createElement('div');
      profile.style.cssText='background:#eef2ff;border:1.5px solid #c7d2fe;border-radius:12px;padding:14px 16px;margin-bottom:14px;';
      profile.innerHTML='<div style="font-weight:700;font-size:15px;color:#3730a3;margin-bottom:4px;">'+sName+'</div>'
        +'<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-bottom:8px;">'
        +'<span><strong style="color:#dc2626;">'+totalAbs+'</strong> absences</span>'
        +'<span><strong style="color:#ea580c;">'+totalLate+'</strong> lates</span>'
        +'<span><strong style="color:#475569;">'+totalClasses+'</strong> classes total</span>'
        +(totalClasses>0?'<span><strong style="color:#16a34a;">'+Math.round((totalClasses-totalAbs)/totalClasses*100)+'%</strong> attendance</span>':'')
        +'</div>';
      // Show their absence notes
      const notes=sRecs.filter(r=>r.stu.note).map(r=>'<div style="font-size:12px;color:#64748b;padding:3px 0;border-bottom:1px solid #e2e8f0;">'+r.date+' &middot; '+r.teacher+' &middot; <em>'+r.stu.note+'</em></div>').join('');
      if(notes)profile.innerHTML+='<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Notes</div>'+notes;
      wrap.appendChild(profile);
    }
  }

  recs.forEach(r=>{
    const nA=(r.students||[]).filter(s=>s.status==='absent'&&s.flag!=='dropped').length;
    const nL=(r.students||[]).filter(s=>s.status==='late').length;
    const nNew=(r.students||[]).filter(s=>s.flag==='new').length;
    const nDrop=(r.students||[]).filter(s=>s.flag==='dropped').length;
    const isEd=logState.editing===r.id,isEx=logState.expanded===r.id;

    const isPlanning=!!r.isPlanning;
    const card=document.createElement('div');card.className='log-card';
    if(isPlanning)card.style.cssText='border:1.5px solid #c7d2fe;border-radius:11px;margin-bottom:8px;overflow:hidden;background:#eef2ff;';

    // Header row
    const hdrRow=document.createElement('div');hdrRow.style.cssText='display:flex;align-items:flex-start;gap:8px;padding:10px 13px;cursor:pointer;';
    const info=document.createElement('div');info.style.cssText='flex:1;min-width:0;';
    info.innerHTML='<div style="font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+r.teacher+' · '+r.course+'</div>'
      +'<div style="font-size:11px;color:#94a3b8;margin-top:1px;">'+r.day+' '+r.time+' · '+r.week+' · '+r.date+(r.submittedAt?'<span style="margin-left:4px;color:#cbd5e1;">· '+r.submittedAt+'</span>':'')+'</div>'
      +(r.commentAt?'<div style="font-size:10px;color:#a5b4fc;margin-top:1px;">💬 '+r.commentAt+'</div>':'');
    hdrRow.appendChild(info);
    const badges=document.createElement('div');badges.style.cssText='display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;align-items:center;';
    if(nA>0)badges.appendChild(ctr('a',nA+'A'));
    if(nL>0)badges.appendChild(ctr('l',nL+'L'));
    if(nNew>0){const s=document.createElement('span');s.style.cssText='background:#dcfce7;color:#15803d;padding:2px 6px;border-radius:20px;font-size:11px;font-weight:700;';s.textContent='+'+nNew;badges.appendChild(s);}
    if(nDrop>0){const s=document.createElement('span');s.style.cssText='background:#fee2e2;color:#b91c1c;padding:2px 6px;border-radius:20px;font-size:11px;font-weight:700;';s.textContent='−'+nDrop;badges.appendChild(s);}
    if(!nA&&!nL)badges.appendChild(ctr('p','✓'));
    const ci=document.createElement('span');ci.style.cssText='font-size:10px;color:'+(r.commentDone?'#94a3b8':'#d97706')+';margin-left:2px;';ci.textContent=r.commentDone?'💬':'✏️';badges.appendChild(ci);
    hdrRow.appendChild(badges);
    hdrRow.onclick=()=>{if(!isEd){logState.expanded=isEx?null:r.id;renderLog();}};
    card.appendChild(hdrRow);

    // Comment display
    if(!isEd&&r.comment){
      const cd=document.createElement('div');cd.style.cssText='padding:0 13px 0;font-size:13px;color:#475569;border-top:1px solid #f1f5f9;padding-top:7px;';
      cd.innerHTML='<span style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.05em;margin-right:5px;">Comment</span>'+r.comment;
      card.appendChild(cd);

      // Admin feedback
      const at_=state.activeTeacher;
      if(at_===''){
        // Admin writes feedback
        const fbWrap=document.createElement('div');fbWrap.style.cssText='padding:6px 13px 10px;background:#f8fafc;border-top:1px solid #f1f5f9;';
        if(r.adminFeedback){
          const fbDisp=document.createElement('div');fbDisp.style.cssText='font-size:12px;color:#4f46e5;margin-bottom:6px;padding:6px 9px;background:#eef2ff;border-radius:7px;';
          fbDisp.innerHTML='<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6366f1;margin-right:5px;">Your feedback</span><span style="color:#3730a3">'+r.adminFeedback+'</span>'+(r.adminFeedbackAt?'<span style="font-size:10px;color:#94a3b8;display:block;margin-top:2px;">'+r.adminFeedbackAt+'</span>':'');
          fbWrap.appendChild(fbDisp);
          // Show teacher reply if any
          if(r.teacherReply){
            const trDiv=document.createElement('div');
            trDiv.style.cssText='font-size:12px;margin-bottom:6px;padding:6px 9px;background:#f0fdf4;border-radius:7px;border:1px solid #86efac;';
            const isUnread=!r.teacherReplyRead;
            trDiv.innerHTML='<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#15803d;margin-right:5px;">'+(isUnread?'&#128236; ':'')+'Reply from '+r.teacher+'</span><span style="color:#14532d">'+r.teacherReply+'</span>'+(r.teacherReplyAt?'<span style="font-size:10px;color:#94a3b8;display:block;margin-top:2px;">'+r.teacherReplyAt+'</span>':'');
            fbWrap.appendChild(trDiv);
            // Mark reply as read
            if(isUnread){const upd={...r,teacherReplyRead:true};state.records=state.records.map(rec=>rec.id===r.id?upd:rec);lsSet('ewj-records',state.records);fetch(FB_URL+'/records/r'+r.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(upd)}).catch(()=>{});}
          }
        }
        const fbRow=document.createElement('div');fbRow.style.cssText='display:flex;gap:7px;align-items:center;';
        const fbIn=document.createElement('input');fbIn.type='text';fbIn.style.cssText='flex:1;padding:6px 9px;border:1.5px solid #c7d2fe;border-radius:7px;font-size:12px;font-family:inherit;outline:none;background:#fff;';
        fbIn.placeholder=r.adminFeedback?'Edit feedback…':'Add feedback for '+r.teacher+'…';fbIn.value=r.adminFeedback||'';
        const fbBtn=document.createElement('button');fbBtn.style.cssText='border:none;border-radius:7px;background:#4f46e5;color:#fff;padding:6px 12px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;white-space:nowrap;';
        fbBtn.textContent=r.adminFeedback?'Update':'Send';
        fbBtn.onclick=async()=>{
  const val=fbIn.value.trim();if(!val)return;
  const now=new Date();
  const fbData={adminFeedback:val,adminFeedbackAt:fmtD(now)+' '+fmtT(now),adminFeedbackRead:false,teacherReply:r.teacherReply||'',teacherReplyAt:r.teacherReplyAt||null,teacherReplyRead:r.teacherReplyRead||false};
  // Save feedback to SEPARATE path — never touches records
  await saveFeedback(r.id, fbData);
  // Update local record display only
  state.records=state.records.map(rec=>rec.id===r.id?{...rec,...fbData}:rec);
  renderLog();
};
        fbRow.appendChild(fbIn);fbRow.appendChild(fbBtn);fbWrap.appendChild(fbRow);
        card.appendChild(fbWrap);
      } else if(at_===r.teacher&&r.adminFeedback){
        // Teacher reads feedback and can reply
        const isUnread=!r.adminFeedbackRead;
        const fbTeacher=document.createElement('div');
        fbTeacher.style.cssText='margin:0 13px 0;padding:8px 11px;background:'+(isUnread?'#eef2ff':'#f8fafc')+';border:1.5px solid '+(isUnread?'#c7d2fe':'#e2e8f0')+';border-radius:8px 8px 0 0;';
        fbTeacher.innerHTML='<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:'+(isUnread?'#4f46e5':'#94a3b8')+';margin-bottom:4px;">'+(isUnread?'&#128236; New feedback from John':'&#128172; Feedback from John')+'</div>'+'<div style="font-size:13px;color:#1e293b;">'+r.adminFeedback+'</div>'+(r.adminFeedbackAt?'<div style="font-size:10px;color:#94a3b8;margin-top:4px;">'+r.adminFeedbackAt+'</div>':'');
        card.appendChild(fbTeacher);
        if(r.teacherReply){
          const replyDiv=document.createElement('div');
          replyDiv.style.cssText='margin:0 13px 0;padding:8px 11px;background:#f0fdf4;border:1.5px solid #86efac;border-top:none;border-radius:0;font-size:13px;';
          replyDiv.innerHTML='<span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#15803d;margin-right:5px;">Your reply</span>'+r.teacherReply+(r.teacherReplyAt?'<div style="font-size:10px;color:#94a3b8;margin-top:3px;">'+r.teacherReplyAt+'</div>':'');
          card.appendChild(replyDiv);
        }
        const replyWrap=document.createElement('div');
        replyWrap.style.cssText='margin:0 13px 10px;display:flex;gap:0;border:1.5px solid '+(isUnread?'#c7d2fe':'#e2e8f0')+';border-top:none;border-radius:0 0 8px 8px;overflow:hidden;';
        const replyIn=document.createElement('input');replyIn.type='text';
        replyIn.style.cssText='flex:1;padding:7px 10px;border:none;outline:none;font-size:12px;font-family:inherit;background:#fff;';
        replyIn.placeholder=r.teacherReply?'Update reply...':'Reply to John...';
        replyIn.value=r.teacherReply||'';
        const replyBtn=document.createElement('button');
        replyBtn.style.cssText='border:none;background:#15803d;color:#fff;padding:7px 13px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;';
        replyBtn.textContent=r.teacherReply?'Update':'Reply';
        replyBtn.onclick=async()=>{
          const val=replyIn.value.trim();if(!val)return;
          const now=new Date();
          const existing=state.feedback&&state.feedback[r.id]?state.feedback[r.id]:{};
          const fbData={...existing,teacherReply:val,teacherReplyAt:fmtD(now)+' '+fmtT(now),teacherReplyRead:false};
          await saveFeedback(r.id, fbData);
          state.records=state.records.map(rec=>rec.id===r.id?{...rec,...fbData}:rec);
          renderLog();
        };
        replyWrap.appendChild(replyIn);replyWrap.appendChild(replyBtn);card.appendChild(replyWrap);
        if(isUnread){const upd={...r,adminFeedbackRead:true};state.records=state.records.map(rec=>rec.id===r.id?upd:rec);lsSet('ewj-records',state.records);fetch(FB_URL+'/records/r'+r.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(upd)}).catch(()=>{});}
      }
    }

    // Expanded detail
    if(isEx&&!isEd){
      const det=document.createElement('div');det.style.cssText='border-top:1px solid #f1f5f9;padding:7px 13px 9px;';
      const nonPresent=(r.students||[]).filter(s=>s.status!=='present'||s.flag);
      if(!nonPresent.length){det.innerHTML='<div style="font-size:12px;color:#16a34a;">All present ✓</div>';}
      else{nonPresent.forEach(s=>{
        const row=document.createElement('div');row.style.cssText='display:flex;gap:6px;align-items:center;padding:3px 0;font-size:12px;border-bottom:1px solid #f8fafc;';
        row.innerHTML='<span style="flex:1;font-weight:500;">'+s.name+'</span>';
        if(s.flag==='new')row.innerHTML+='<span style="background:#dcfce7;color:#15803d;padding:1px 6px;border-radius:20px;font-size:11px;font-weight:700;">NEW</span>';
        if(s.flag==='dropped')row.innerHTML+='<span style="background:#fee2e2;color:#b91c1c;padding:1px 6px;border-radius:20px;font-size:11px;font-weight:700;">left</span>';
        if(s.status==='absent'&&s.flag!=='dropped')row.appendChild(ctr('a','A'));
        if(s.status==='late')row.appendChild(ctr('l','L'));
        if(s.note)row.innerHTML+='<span style="color:#94a3b8;font-size:11px;font-style:italic;">'+s.note+'</span>';
        det.appendChild(row);
      });}
      card.appendChild(det);
    }

    // Comment editor or button
    if(isEd){
      const ed=document.createElement('div');ed.style.cssText='border-top:1.5px solid #c7d2fe;background:#eef2ff;padding:11px 13px;';
      const edTitle=document.createElement('div');edTitle.style.cssText='font-size:12px;font-weight:700;color:#4f46e5;margin-bottom:7px;';edTitle.textContent='✏️ Comment — '+r.course+' · '+r.day+' '+r.time;ed.appendChild(edTitle);
      const ta=document.createElement('textarea');ta.style.cssText='width:100%;padding:8px 11px;border:1.5px solid #c7d2fe;border-radius:8px;outline:none;font-size:13px;font-family:inherit;resize:none;min-height:76px;background:#fff;display:block;margin-bottom:7px;';ta.placeholder='How did the class go?';ta.value=logState.draft;ta.oninput=e=>{logState.draft=e.target.value;};ed.appendChild(ta);
      const chips=document.createElement('div');chips.style.cssText='display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;';
      CHIPS.forEach(c=>{const cb=document.createElement('button');cb.style.cssText='border:1px solid #c7d2fe;background:#fff;border-radius:20px;padding:3px 9px;font-size:11px;color:#4f46e5;cursor:pointer;font-family:inherit;';cb.textContent=c;cb.onclick=()=>{logState.draft=logState.draft?logState.draft+' · '+c:c;ta.value=logState.draft;};chips.appendChild(cb);});
      ed.appendChild(chips);
      const btnRow=document.createElement('div');btnRow.style.cssText='display:flex;gap:7px;';
      const saveBtn=document.createElement('button');saveBtn.style.cssText='background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;';saveBtn.textContent='Save comment';
      saveBtn.onclick=async()=>{
        const now=new Date();
        const updated=state.records.map(rec=>rec.id===r.id?{...rec,comment:logState.draft,commentDone:logState.draft.trim().length>0,commentAt:logState.draft.trim()?fmtD(now)+' '+fmtT(now):null}:rec);
        // Update local state immediately so UI refreshes without needing reload
        state.records=updated;
        lsSet('ewj-records',updated);
        logState.editing=null;logState.draft='';
        renderLog();renderTabBar();
        // Write only the updated record to Firebase in background
        const updatedRec=updated.find(rec=>rec.id===r.id);
        if(updatedRec){
          acquireWriteLock();
          fetch(FB_URL+'/records/r'+updatedRec.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(updatedRec)}).catch(e=>console.warn('Comment save failed:',e.message));
        }
      };
      btnRow.appendChild(saveBtn);
      const cancelBtn=document.createElement('button');cancelBtn.style.cssText='background:#fff;color:#64748b;border:1.5px solid #e2e8f0;border-radius:8px;padding:8px 13px;font-size:13px;font-family:inherit;cursor:pointer;';cancelBtn.textContent='Cancel';cancelBtn.onclick=()=>{logState.editing=null;logState.draft='';renderLog();};btnRow.appendChild(cancelBtn);
      ed.appendChild(btnRow);card.appendChild(ed);
    } else {
      const btnWrap=document.createElement('div');btnWrap.style.cssText='padding:0 13px 9px;display:flex;justify-content:flex-end;';
      const cb=document.createElement('button');cb.style.cssText='border:1.5px solid '+(r.commentDone?'#e2e8f0':'#fde047')+';background:'+(r.commentDone?'#f8fafc':'#fef9c3')+';color:'+(r.commentDone?'#64748b':'#854d0e')+';border-radius:7px;padding:5px 11px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;';
      cb.textContent=r.commentDone?'✏️ Edit comment':'✏️ Add comment';
      cb.onclick=()=>{logState.editing=r.id;logState.draft=r.comment||'';logState.expanded=null;renderLog();};
      btnWrap.appendChild(cb);card.appendChild(btnWrap);
    }

    // ── Admin controls (delete register + edit students) ─────────────
    if(!at){
      const adminBar=document.createElement('div');
      adminBar.style.cssText='display:flex;align-items:center;gap:8px;padding:7px 13px;background:#fef9c3;border-top:1px solid #fde047;';
      const adminLbl=document.createElement('span');adminLbl.style.cssText='font-size:11px;font-weight:600;color:#854d0e;flex:1;';adminLbl.textContent='Admin';adminBar.appendChild(adminLbl);

      // Edit students button
      const editStuBtn=document.createElement('button');
      editStuBtn.style.cssText='border:1.5px solid #86efac;background:#fff;border-radius:7px;padding:4px 10px;font-size:11px;font-family:inherit;cursor:pointer;color:#15803d;font-weight:600;';
      editStuBtn.textContent='✏️ Edit students';
      editStuBtn.onclick=()=>{logState.editingStudents=logState.editingStudents===r.id?null:r.id;renderLog();};
      adminBar.appendChild(editStuBtn);

      // Delete register button
      const delRegBtn=document.createElement('button');
      delRegBtn.style.cssText='border:1.5px solid #fca5a5;background:#fff;border-radius:7px;padding:4px 10px;font-size:11px;font-family:inherit;cursor:pointer;color:#dc2626;font-weight:600;';
      delRegBtn.textContent='🗑 Delete';
      delRegBtn.onclick=async()=>{
        if(!confirm('Delete register for '+r.teacher+' — '+r.course+' on '+r.date+'?')) return;
        // Delete directly from Firebase by ID — don't touch other records
        await fbDeleteRecord(r.id);
        // Remove only the FIRST occurrence with this id from local state
        const idx=state.records.findIndex(rec=>rec.id===r.id);
        if(idx!==-1) state.records.splice(idx,1);
        lsSet('ewj-records',state.records);
        logState.editingStudents=null;
        renderLog();renderTabBar();
      };
      adminBar.appendChild(delRegBtn);
      card.appendChild(adminBar);

      // Student editor panel
      if(logState.editingStudents===r.id){
        const stuEdit=document.createElement('div');
        stuEdit.style.cssText='padding:10px 13px;border-top:1px solid #f1f5f9;background:#f8fafc;';
        const stuTitle=document.createElement('div');stuTitle.style.cssText='font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;';stuTitle.textContent='Edit student statuses';stuEdit.appendChild(stuTitle);
        (r.students||[]).forEach((s,si)=>{
          const row=document.createElement('div');
          row.style.cssText='display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid #f1f5f9;font-size:13px;flex-wrap:wrap;';
          const nm=document.createElement('span');nm.style.cssText='flex:1;min-width:100px;font-weight:500;font-size:12px;';nm.textContent=s.name;row.appendChild(nm);
          // Status
          const stSel=document.createElement('select');stSel.style.cssText='padding:4px 7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit;background:#fff;';
          ['present','absent','late','dropped'].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;if(v===s.status)o.selected=true;stSel.appendChild(o);});
          // Flag
          const flSel=document.createElement('select');flSel.style.cssText='padding:4px 7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit;background:#fff;';
          [['','—'],['new','New'],['dropped','Drop']].forEach(([v,l])=>{const o=document.createElement('option');o.value=v;o.textContent=l;if(v===(s.flag||''))o.selected=true;flSel.appendChild(o);});
          // Note
          const nIn=document.createElement('input');nIn.type='text';nIn.value=s.note||'';nIn.placeholder='note…';nIn.style.cssText='width:80px;padding:4px 7px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:12px;font-family:inherit;';
          // Save
          const svBtn=document.createElement('button');svBtn.style.cssText='border:none;border-radius:6px;background:#4f46e5;color:#fff;padding:4px 10px;font-size:11px;font-family:inherit;font-weight:700;cursor:pointer;white-space:nowrap;';svBtn.textContent='Save';
          svBtn.onclick=async()=>{
            const upd=state.records.map(rec=>{
              if(rec.id!==r.id)return rec;
              const ns=[...rec.students];ns[si]={...ns[si],status:stSel.value,flag:flSel.value,note:nIn.value};
              return{...rec,students:ns};
            });
            // Find updated record and write only it to Firebase
            const editedRec=upd.find(rec=>rec.id===r.id);
            state.records=upd;lsSet('ewj-records',upd);
            if(editedRec){acquireWriteLock();fetch(FB_URL+'/records/r'+editedRec.id+'.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(editedRec)}).catch(()=>{});}
            logState.editingStudents=null;renderLog();
          };
          row.appendChild(stSel);row.appendChild(flSel);row.appendChild(nIn);row.appendChild(svBtn);stuEdit.appendChild(row);
        });
        const doneBtn=document.createElement('button');doneBtn.className='pill';doneBtn.style.marginTop='8px';doneBtn.textContent='Done';doneBtn.onclick=()=>{logState.editingStudents=null;renderLog();};stuEdit.appendChild(doneBtn);
        card.appendChild(stuEdit);
      }
    }
    wrap.appendChild(card);
  });
}

// ── Dashboard tab ─────────────────────────────────────────────────────────
function renderDashboard(){
  const wrap=document.getElementById('tab-dashboard');
  if(!wrap){console.error('tab-dashboard not found');return;}
  wrap.innerHTML='';
  try {
  const at=state.activeTeacher;
  const tw=weekNum(new Date());
  const todayDay=DAYS[Math.min(new Date().getDay()-1,4)]||'Monday';
  const todayStr=fmtD(new Date());
  const filtered=at?state.records.filter(r=>r.teacher===at):state.records;
  const classRecs=filtered.filter(r=>!r.isPlanning);
  const twRecs=classRecs.filter(r=>r.week==='Week '+tw);
  const twAbs=twRecs.reduce((s,r)=>s+(r.students||[]).filter(x=>x.status==='absent'&&x.flag!=='dropped').length,0);
  const twLate=twRecs.reduce((s,r)=>s+(r.students||[]).filter(x=>x.status==='late').length,0);
  const twTotal=twRecs.reduce((s,r)=>s+(r.students||[]).filter(x=>x.flag!=='dropped').length,0);
  const twPresent=twRecs.reduce((s,r)=>s+(r.students||[]).filter(x=>(x.status==='present'||x.status==='late')&&x.flag!=='dropped').length,0);
  const aMap4=absMap(true);
  const aMap_=absMap(); // last 4 weeks
  const atRisk=Object.entries(aMap_).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1]);
  const atRisk4=Object.entries(aMap4).filter(([,n])=>n>=3).sort((a,b)=>b[1]-a[1]);
  const newS=[...new Set(classRecs.flatMap(r=>(r.students||[]).filter(s=>s.flag==='new').map(s=>s.name)))];
  const drops=[...new Set(classRecs.flatMap(r=>(r.students||[]).filter(s=>s.flag==='dropped').map(s=>s.name)))];
  const unmarked=state.schedule.filter(s=>s.day===todayDay&&(!at||s.teacher===at)).filter(s=>!state.records.some(r=>r.teacher===s.teacher&&r.day===todayDay&&r.time===s.time&&r.date===todayStr));

  // ── Per-teacher stats ─────────────────────────────────────────────────
  const tStats={};
  classRecs.forEach(r=>{
    if(!tStats[r.teacher])tStats[r.teacher]={abs:0,late:0,present:0,total:0,sessions:0,planning:0,absByWeek:{}};
    const studs=r.students||[];
    const dropped=studs.filter(s=>s.flag==='dropped').length;
    const active=studs.filter(s=>s.flag!=='dropped');
    tStats[r.teacher].sessions++;
    tStats[r.teacher].total+=active.length;
    tStats[r.teacher].present+=active.filter(s=>s.status==='present'||s.status==='late').length;
      tStats[r.teacher].lateCount=(tStats[r.teacher].lateCount||0)+active.filter(s=>s.status==='late').length;
      tStats[r.teacher].abs+=active.filter(s=>s.status==='absent').length;
      tStats[r.teacher].late+=active.filter(s=>s.status==='late').length;
  });
  filtered.filter(r=>r.isPlanning).forEach(r=>{
    if(!tStats[r.teacher])tStats[r.teacher]={abs:0,late:0,present:0,total:0,sessions:0,planning:0};
    tStats[r.teacher].planning=(tStats[r.teacher].planning||0)+1;
  });

  wrap.innerHTML='<div style="font-size:12px;color:#94a3b8;margin-bottom:12px;">Week '+tw+' &middot; '+todayDay+'</div>';

  // ── Attendance rate donut for this week ───────────────────────────────
  if(twTotal>0){
    const attRate=Math.round(twPresent/twTotal*100);
    const absRate=Math.round(twAbs/twTotal*100);
    const lateRate=Math.round(twLate/twTotal*100);
    const chartWrap=document.createElement('div');
    chartWrap.style.cssText='display:flex;align-items:center;gap:20px;background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px 18px;margin-bottom:14px;flex-wrap:wrap;';

    // SVG donut chart
    const size=90,stroke=14,r=size/2-stroke/2,circ=2*Math.PI*r;
    const pPct=twPresent/twTotal,aPct=twAbs/twTotal,lPct=twLate/twTotal;
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('width',size);svg.setAttribute('height',size);svg.setAttribute('viewBox','0 0 '+size+' '+size);
    svg.style.flexShrink='0';
    // Background circle
    const bg=document.createElementNS('http://www.w3.org/2000/svg','circle');
    bg.setAttribute('cx',size/2);bg.setAttribute('cy',size/2);bg.setAttribute('r',r);
    bg.setAttribute('fill','none');bg.setAttribute('stroke','#e2e8f0');bg.setAttribute('stroke-width',stroke);
    svg.appendChild(bg);
    // Present arc (green)
    let offset=0;
    [[pPct,'#16a34a'],[lPct,'#ea580c'],[aPct,'#dc2626']].forEach(([pct,col])=>{
      if(pct<=0)return;
      const arc=document.createElementNS('http://www.w3.org/2000/svg','circle');
      arc.setAttribute('cx',size/2);arc.setAttribute('cy',size/2);arc.setAttribute('r',r);
      arc.setAttribute('fill','none');arc.setAttribute('stroke',col);arc.setAttribute('stroke-width',stroke);
      arc.setAttribute('stroke-dasharray',circ*pct+' '+(circ*(1-pct)));
      arc.setAttribute('stroke-dashoffset',-(circ*offset-circ/4));
      arc.setAttribute('stroke-linecap','round');
      svg.appendChild(arc);offset+=pct;
    });
    // Centre text
    const ct=document.createElementNS('http://www.w3.org/2000/svg','text');
    ct.setAttribute('x',size/2);ct.setAttribute('y',size/2+1);ct.setAttribute('text-anchor','middle');
    ct.setAttribute('dominant-baseline','middle');ct.setAttribute('font-size','16');ct.setAttribute('font-weight','700');ct.setAttribute('fill','#1e293b');
    ct.setAttribute('fill',attRate>=80?'#16a34a':attRate>=65?'#d97706':'#dc2626');ct.textContent=attRate+'%';svg.appendChild(ct);
    const ct2=document.createElementNS('http://www.w3.org/2000/svg','text');
    ct2.setAttribute('x',size/2);ct2.setAttribute('y',size/2+14);ct2.setAttribute('text-anchor','middle');
    ct2.setAttribute('dominant-baseline','middle');ct2.setAttribute('font-size','8');ct2.setAttribute('fill','#94a3b8');
    ct2.textContent='present';svg.appendChild(ct2);
    chartWrap.appendChild(svg);

    // Legend
    const legend=document.createElement('div');legend.style.cssText='flex:1;min-width:140px;';
    legend.innerHTML='<div style="font-weight:700;font-size:14px;color:#1e293b;margin-bottom:8px;">This week &middot; '+twTotal+' student slots</div>';
    [['#16a34a',twPresent,'Present',pPct],['#ea580c',twLate,'Late',lPct],['#dc2626',twAbs,'Absent',aPct]].forEach(([col,n,lbl,pct])=>{
      if(n===0)return;
      const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:13px;';
      row.innerHTML='<span style="width:10px;height:10px;border-radius:50%;background:'+col+';flex-shrink:0;display:inline-block;"></span>'
        +'<span style="flex:1;color:#475569;">'+lbl+'</span>'
        +'<span style="font-weight:700;color:'+col+';">'+n+'</span>'
        +'<span style="font-size:11px;color:#94a3b8;width:36px;text-align:right;">'+Math.round(pct*100)+'%</span>';
      legend.appendChild(row);
    });
    chartWrap.appendChild(legend);
    wrap.appendChild(chartWrap);
  }

  // ── Stat cards ────────────────────────────────────────────────────────
  const grid=ce('stat-grid');
  [['#dc2626',twAbs,'Absences this week'],['#ea580c',twLate,'Lates this week'],['#b91c1c',atRisk4.length,'At risk (last 4 wks)'],['#475569',classRecs.length,'Total records']].forEach(([col,val,lbl])=>{
    grid.innerHTML+='<div class="stat"><div style="font-size:26px;font-weight:700;color:'+col+';line-height:1;">'+val+'</div><div style="font-size:11px;color:#64748b;margin-top:4px;">'+lbl+'</div></div>';
  });
  wrap.appendChild(grid);

  // ── Today unmarked ────────────────────────────────────────────────────
  if(unmarked.length){
    const lb=ce('lbl');lb.style.color='#dc2626';lb.textContent='⚠️ TODAY\'S CLASSES WITHOUT REGISTER';wrap.appendChild(lb);
    unmarked.forEach(s=>{const d=document.createElement('div');d.style.cssText='background:#fef2f2;border:1.5px solid #fca5a5;border-radius:9px;padding:9px 12px;margin-bottom:6px;font-size:13px;';d.innerHTML='<strong>'+s.teacher+'</strong> &middot; '+s.time+' &middot; '+s.course+' <span style="color:#94a3b8;font-size:11px;">('+(s.students||[]).length+' students)</span>';wrap.appendChild(d);});
  }

  // ── At risk ───────────────────────────────────────────────────────────
  if(atRisk4.length||atRisk.length){
    const showList=atRisk4.length?atRisk4:atRisk;
    const lb=ce('lbl',atRisk4.length?'At risk — last 4 weeks (3+ absences)':'Students with 3+ absences (all time)');wrap.appendChild(lb);
    showList.slice(0,15).forEach(([name,count])=>{
      const total=aMap_[name]||count;
      // Find which classes they missed
      const missedClasses=classRecs.filter(r=>(r.students||[]).some(s=>s.name===name&&s.status==='absent'&&s.flag!=='dropped'))
        .map(r=>r.teacher+' '+r.course+' ('+r.date+')').slice(0,5);
      const d=document.createElement('div');
      d.style.cssText='background:'+(count>=5?'#fef2f2':'#fef9c3')+';border:1.5px solid '+(count>=5?'#fca5a5':'#fde047')+';border-radius:9px;padding:8px 12px;margin-bottom:5px;font-size:13px;';
      d.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:'+(missedClasses.length?'5':'0')+'px;">'
        +'<strong>'+name+'</strong>'
        +'<div><span style="font-weight:700;color:#dc2626;">'+count+' recent</span><span style="font-size:11px;color:#94a3b8;margin-left:6px;">'+total+' total</span></div>'
        +'</div>'
        +(missedClasses.length?'<div style="font-size:11px;color:#92400e;">'+missedClasses.join(' · ')+'</div>':'');
      wrap.appendChild(d);
    });
  }

  // ── Per-teacher breakdown with bar chart ──────────────────────────────
  const ts=Object.entries(tStats).sort((a,b)=>{const ra=a[1].total>0?a[1].present/a[1].total:0;const rb=b[1].total>0?b[1].present/b[1].total:0;return rb-ra;});
  if(ts.length){
    const lb=ce('lbl','By teacher — attendance rate');wrap.appendChild(lb);
    ts.forEach(([t,st])=>{
      if(!st.total&&!st.planning)return;
      const rate=st.total>0?Math.round(st.present/st.total*100):null;
      const absRate=st.total>0?Math.round(st.abs/st.total*100):0;
      const lateRate=st.total>0?Math.round(st.late/st.total*100):0;
      const card=document.createElement('div');
      card.style.cssText='border:1.5px solid #e2e8f0;border-radius:11px;background:#fff;margin-bottom:8px;overflow:hidden;';

      // Header row
      const hdr=document.createElement('div');hdr.style.cssText='display:flex;align-items:center;gap:10px;padding:11px 14px 8px;';
      hdr.innerHTML='<span style="font-weight:700;font-size:14px;flex:1;">'+t+'</span>'
        +'<span style="font-size:12px;color:#64748b;">'+st.sessions+' classes</span>';
      if(st.planning>0)hdr.innerHTML+='<span style="font-size:11px;background:#eef2ff;color:#4f46e5;padding:2px 7px;border-radius:20px;font-weight:600;">'+st.planning+' planning</span>';
      if(rate!==null){
        const rateCol=rate>=80?'#16a34a':rate>=65?'#d97706':'#dc2626';
        hdr.innerHTML+='<span style="font-size:16px;font-weight:700;color:'+rateCol+';">'+rate+'%</span>';
      }
      card.appendChild(hdr);

      if(st.total>0){
        // Stacked bar
        const barWrap=document.createElement('div');barWrap.style.cssText='padding:0 14px 6px;';
        const bar=document.createElement('div');bar.style.cssText='height:8px;border-radius:4px;background:#f1f5f9;overflow:hidden;display:flex;margin-bottom:6px;';
        const lc=st.lateCount||0;const pp=st.present-lc;
        [[pp,'#16a34a'],[lc,'#ea580c'],[st.abs,'#dc2626']].forEach(([n,col])=>{
          if(n<=0)return;
          const seg=document.createElement('div');seg.style.cssText='height:100%;background:'+col+';width:'+Math.round(n/st.total*100)+'%;';
          bar.appendChild(seg);
        });
        barWrap.appendChild(bar);
        // Stats row
        const stats=document.createElement('div');stats.style.cssText='display:flex;gap:12px;font-size:12px;flex-wrap:wrap;';
        const lc2=st.lateCount||0;const pp2=st.present-lc2;
        stats.innerHTML='<span style="color:#64748b;"><strong style="color:#1e293b;">'+st.total+'</strong> slots</span>';
        if(pp2>0)stats.innerHTML+='<span style="color:#16a34a;"><strong>'+pp2+'</strong> present</span>';
        if(lc2>0)stats.innerHTML+='<span style="color:#ea580c;"><strong>'+lc2+'</strong> late</span>';
        if(st.abs>0)stats.innerHTML+='<span style="color:#dc2626;"><strong>'+st.abs+'</strong> absent ('+absRate+'%)</span>';
        barWrap.appendChild(stats);

        // Collect absent and late student names
        const tRecs=classRecs.filter(r=>r.teacher===t);
        const absentStudents=[...new Set(tRecs.flatMap(r=>(r.students||[]).filter(s=>s.status==='absent'&&s.flag!=='dropped').map(s=>s.name)))].sort();
        const lateStudents=[...new Set(tRecs.flatMap(r=>(r.students||[]).filter(s=>s.status==='late').map(s=>s.name)))].sort();
        if(absentStudents.length||lateStudents.length){
          const toggleId='tog-'+t.replace(/[^a-z]/gi,'');
          const detailId='det-'+t.replace(/[^a-z]/gi,'');
          const tog=document.createElement('button');
          tog.style.cssText='border:none;background:none;color:#94a3b8;font-size:11px;font-family:inherit;cursor:pointer;padding:0;text-decoration:underline;margin-top:4px;display:block;';
          tog.textContent='Show names ▾';
          tog.onclick=()=>{const el=document.getElementById(detailId);const open=el.style.display!=='none';el.style.display=open?'none':'block';tog.textContent=open?'Show names ▾':'Hide names ▴';};
          barWrap.appendChild(tog);
